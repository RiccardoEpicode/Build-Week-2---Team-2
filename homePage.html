<!DOCTYPE html>
<html lang="en" class="bg-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <!-- navigation -->
    <nav class="navbar navbar-expand-lg bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"
          ><img src="./Public/imgs/logo.svg" alt="" style="height: 40px"
        /></a>
        <a class="navbar-brand" href="#"
          ><img src="./Public/homeIcon.png" alt="" style="height: 40px"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarScroll"
          aria-controls="navbarScroll"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarScroll">
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder=" 🔎Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
          <ul
            class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll"
            style="--bs-scroll-height: 100px"
          >
            <li class="nav-item">
              <a class="nav-link active text-white" aria-current="page" href="#"
                >Explore Premium</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#">⬇️Install App</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">🔔</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">🧑‍🤝‍🧑</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled text-white" aria-disabled="true">M</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- FOOTER/PLAYER -->

    <footer>
      <div
        class="container-fluid fixed-bottom bg-dark border-top border-secondary"
      >
        <div
          class="row align-items-center p-2 text-white text-center text-xxl-start"
        >
          <!-- Song info -->
          <div
            class="col-12 col-xxl-3 d-flex align-items-center justify-content-center justify-content-xxl-start mb-2 mb-xxl-0"
          >
            <img
              src="https://i.scdn.co/image/ab67616d00004851c5e237a1ee3a1a7a3e6a3a3d"
              class="img-thumbnail me-2"
              style="width: 50px; height: 50px"
            />
            <div class="me-2">
              <h6 class="mb-0">Song Title</h6>
              <small class="text-secondary">Artist Name</small>
            </div>
            <button class="btn btn-dark btn-sm ms-2">
              <img src="./Public/add.png" alt="add" />
            </button>
          </div>

          <!-- Controls -->

          <div class="col-12 col-xxl-6 text-center mb-2 mb-xxl-0">
            <div class="btn-group">
              <button class="btn btn-dark btn-sm">
                <img src="./Public/shuffle.png" alt="shuffle" />
              </button>
              <button class="btn btn-dark btn-sm">
                <img src="./Public/playback.png" alt="prev" />
              </button>
              <button class="btn btn-dark btn-sm">
                <img src="./Public/play.png" alt="play" />
              </button>
              <button class="btn btn-dark btn-sm">
                <img src="./Public/forward.png" alt="next" />
              </button>
              <button class="btn btn-dark btn-sm">
                <img src="./Public/repeat.png" alt="repeat" />
              </button>
            </div>

            <div class="d-flex align-items-center justify-content-center mt-2">
              <small class="me-2">0:02</small>
              <div class="progress w-75" style="height: 5px">
                <div class="progress-bar bg-success" style="width: 40%"></div>
              </div>
              <small class="ms-2">2:46</small>
            </div>
          </div>

          <!-- Extra icons -->
          <div
            class="col-12 col-xxl-3 d-flex justify-content-center justify-content-xxl-end align-items-center gap-2 mt-2 mt-xxl-0 extra-icons"
          >
            <button class="btn btn-dark btn-sm">
              <img src="./Public/nowplaying.png" alt="now playing" />
            </button>
            <button class="btn btn-dark btn-sm">
              <img src="./Public/mic.png" alt="mic" />
            </button>
            <button class="btn btn-dark btn-sm">
              <img src="./Public/queue.png" alt="queue" />
            </button>
            <button class="btn btn-dark btn-sm">
              <img src="./Public/connect.png" alt="connect" />
            </button>
            <button class="btn btn-dark btn-sm">
              <img src="./Public/volume.png" alt="volume" />
            </button>

            <!-- Barra volume -->
            <input
              type="range"
              class="form-range w-100 w-xxl-25 d-inline"
              min="0"
              max="100"
              value="70"
            />

            <button class="btn btn-dark btn-sm">
              <img src="./Public/miniPlayer.png" alt="mini player" />
            </button>
            <button class="btn btn-dark btn-sm">
              <img src="./Public/fullscreen.png" alt="fullscreen" />
            </button>
          </div>
        </div>
      </div>
    </footer>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
